name: CI

# Quality gate: typecheck, lint, tests and a production build.
# NOTE: this project lives in a subfolder of a larger repo. If BrandStudio is
# published as its own repository, move this file to the repo root's
# .github/workflows/ and drop the `working-directory`/`defaults` paths below.

on:
  push:
    branches: [main, master, hardening-v1]
  pull_request:

defaults:
  run:
    working-directory: BrandStudio

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BrandStudio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

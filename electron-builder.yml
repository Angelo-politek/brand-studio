appId: com.brandstudio.app
productName: Brand Studio
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  # Backend ships as the frozen sidecar + models via extraResources, never in the asar.
  - '!backend/**'
  # Repo-local binaries/icons are copied via extraResources / buildResources.
  - '!resources/**'
  - '!build/**'
  - '!scripts/**'
  - '!tests/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.ts'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  # PyInstaller-frozen sidecar (built by scripts/build-sidecar.ps1).
  - from: backend/dist-sidecar/brandstudio-sidecar
    to: sidecar/brandstudio-sidecar
  # rembg model, resolved via U2NET_HOME -> resources/backend/models.
  - from: backend/models
    to: backend/models
    filter:
      - '*.onnx'
  # FFmpeg binaries, resolved via BS_FFMPEG/BS_FFPROBE.
  - from: resources/bin/win
    to: bin
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  oneClick: false
  allowToChangeInstallationDirectory: true
npmRebuild: true

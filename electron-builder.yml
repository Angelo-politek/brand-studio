appId: com.brandstudio.app
productName: Brand Studio
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  # Backend ships as the frozen sidecar + models via extraResources, never in the asar.
  - '!backend/**'
  # Repo-local binaries/icons are copied via extraResources / buildResources.
  - '!resources/**'
  - '!build/**'
  - '!scripts/**'
  - '!tests/**'
  # The ~5400 icon SVGs are packed into JSON at build time by
  # scripts/build-icons.mjs and bundled into the renderer, so the raw source
  # packages (~79MB) would otherwise ride along in the asar for nothing.
  - '!node_modules/lucide-static/**'
  - '!node_modules/simple-icons/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.ts'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  # PyInstaller-frozen sidecar (built by scripts/build-sidecar.ps1).
  - from: backend/dist-sidecar/brandstudio-sidecar
    to: sidecar/brandstudio-sidecar
  # rembg models, resolved via U2NET_HOME -> resources/backend/models.
  # Explicit list: isnet-general-use (default) + u2net_human_seg (Person mode).
  # The legacy u2net.onnx is not shipped.
  - from: backend/models
    to: backend/models
    filter:
      - 'isnet-general-use.onnx'
      - 'u2net_human_seg.onnx'
  # FFmpeg binary, resolved via BS_FFMPEG.
  - from: resources/bin/win
    to: bin
    filter:
      - 'ffmpeg.exe'
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  oneClick: false
  allowToChangeInstallationDirectory: true
  license: LICENSE
npmRebuild: true
